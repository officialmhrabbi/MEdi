<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UpCare Mediconnect | AI-Powered Healthcare Platform</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header class="navbar">
    <div class="container">

      <a href="#" class="navbar__logo">
        <i class="fa-solid fa-heart-pulse"></i>
        <span><span class="logo-highlight">UpCare</span> <span class="logo-rest">Mediconnect</span></span>
      </a>

      <nav class="navbar__menu" id="navbarMenu">

        <ul class="navbar__links">
          <li><a href="#" class="is-active">Home</a></li>
          <li>
            <a href="#">
              Services <i class="fa-solid fa-chevron-down dropdown-icon"></i>
            </a>
          </li>
          <li>
            <a href="#" class="navbar__ai-pill">
              <i class="fa-solid fa-robot"></i> AI Assistant
            </a>
          </li>
        </ul>

        <div class="navbar__actions">
          <a href="#" class="navbar__lang">
            <i class="fa-solid fa-globe"></i> EN <i class="fa-solid fa-chevron-down dropdown-icon"></i>
          </a>
          <a href="#" class="btn btn-primary">
            Book Care <i class="fa-solid fa-arrow-right"></i>
          </a>
          <a href="#" class="navbar__login">
            <i class="fa-solid fa-arrow-right-to-bracket"></i> Login
          </a>
        </div>

      </nav>

      <button class="navbar__toggle" id="navbarToggle" aria-label="Toggle menu" aria-expanded="false">
        <span></span>
        <span></span>
        <span></span>
      </button>

    </div>
  </header>

  <main>

    <section class="hero">
      <div class="hero__bg"></div>
      <div class="hero__overlay"></div>

      <div class="container hero__container">
        <div class="hero__content">
          <span class="badge">
            <i class="fa-solid fa-sparkles"></i> AI-Powered Healthcare Platform
          </span>

          <h1 class="hero__title">
            <span class="text-gradient">One Platform.</span>
            <span>Every Care You Need.</span>
          </h1>

          <p class="hero__subtitle">
            AI-powered care for families, seniors, children, and individuals — at home or online.
          </p>

          <div class="hero__actions">
            <a href="#" class="btn btn-primary btn-lg">
              Book Care Now <i class="fa-solid fa-arrow-right"></i>
            </a>
            <a href="#" class="btn btn-outline btn-lg">
              <i class="fa-solid fa-magnifying-glass"></i> Explore Services
            </a>
          </div>
        </div>
      </div>
    </section>

  </main>

  <script src="js/main.js"></script>
</body>
</html>
